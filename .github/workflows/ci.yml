name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: uv sync --locked --dev
        env:
          UV_PYTHON: "3.12"
      - name: Test
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy halcyon
